{% extends "base.html" %}{% block title %}职业体验中{% endblock %}{% block body_class %}page-scenario{% endblock %}
{% block extra_head %}<link rel="stylesheet" href="/static/css/scenario-task.css?v=task-polish-v3">{% endblock %}
{% block content %}
<div id="vn-app" class="vn-container">
<div id="vn-hud" class="vn-hud"><div class="hud-left"><span class="hud-career-icon" id="hud-career-icon"></span><span class="hud-career-name" id="hud-career-name"></span></div><div class="hud-center"><div class="hud-progress"><div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div><span class="progress-text" id="progress-text">0/0</span></div></div><div class="hud-right"><button type="button" class="voice-read-btn" id="voice-read-btn" title="&#26391;&#35835;&#24403;&#21069;&#20869;&#23481;">&#128264;<span>&#26391;&#35835;</span></button><span class="hud-scene-title" id="hud-scene-title"></span></div></div>
<div id="scene-container" class="scene-container"><div id="scene-bg" class="scene-bg"></div><div id="scene-atmosphere" class="scene-atmosphere"></div><div id="scene-location" class="scene-location"></div></div>
<div id="interaction-layer" class="interaction-layer">
<div id="dialogue-box" class="dialogue-box" style="display:none"><div class="dialogue-speaker" id="dialogue-speaker"></div><div class="dialogue-text" id="dialogue-text"></div><div class="dialogue-next" id="dialogue-next" style="display:none"><span class="next-indicator">&#9660;</span></div></div>
<div id="choice-panel" class="choice-panel" style="display:none"><div class="choice-task-header"><div class="choice-task-seal">任务</div><div class="choice-task-title"><span>现在轮到你来决定</span><b id="choice-task-title">情境行动卡</b></div><img id="choice-task-character" class="choice-task-character" alt="职业任务伙伴"></div><p class="choice-prompt" id="choice-prompt"></p><div class="choice-buttons" id="choice-buttons"></div><div class="choice-timer" id="choice-timer"></div></div>
<div id="mentor-panel" class="mentor-panel" style="display:none"><div class="mentor-header"><span class="mentor-icon">&#128302;</span><span class="mentor-name" id="mentor-name">星星导师</span><span class="mentor-badge">AI导师对话</span></div><div class="mentor-round-track" id="mentor-round-track"></div><div class="mentor-instant-feedback" id="mentor-instant-feedback"></div><div class="mentor-question" id="mentor-question"></div><form class="mentor-form" id="mentor-form" onsubmit="submitMentorAnswer(event)"><textarea id="mentor-answer" class="mentor-textarea" placeholder="在这里写下你的想法..." rows="3" maxlength="1000"></textarea><div class="voice-status" id="voice-status" aria-live="polite"></div><div class="mentor-actions"><button type="button" class="mentor-voice" id="mentor-voice-btn">&#127908; &#35821;&#38899;&#36755;&#20837;</button><button type="button" class="mentor-skip" onclick="skipMentor()">跳过这个问题</button><button type="submit" class="mentor-submit">分享我的想法</button></div></form></div>
<div id="transition-overlay" class="transition-overlay" style="display:none"><div class="transition-content"><p class="transition-title" id="transition-title"></p><p class="transition-subtitle">准备进入下一个情境...</p></div></div>
<div id="completion-screen" class="completion-screen" style="display:none"><div class="completion-content"><div class="completion-stars"><span>&#10024;</span><span>&#10024;</span><span>&#10024;</span></div><h2>太棒了！</h2><p id="completion-message"></p><a id="report-link" href="/my-exploration" class="report-button">返回探索中心 <span>&#10132;</span></a></div></div>
</div></div>
<script>window.VN_CONFIG={sessionId:"{{ session_id }}",scenarioIndex:{{ scenario_index }}};</script>{% endblock %}
