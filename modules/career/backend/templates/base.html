<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}职业体验模拟器{% endblock %}</title>
<script defer src="http://localhost:8020/sdk/module-sdk.js"></script>
<link rel="stylesheet" href="/static/css/style.css?v=career-cinematic-v10"><link rel="stylesheet" href="/static/css/responsive.css?v=career-cinematic-v10">
{% block extra_head %}{% endblock %}</head>
<body class="{% block body_class %}{% endblock %}">
<a class="platform-return" href="http://localhost:4173/?from=career" aria-label="返回 AI 伯乐探索星球">← 返回探索星球</a>
<div id="app-container">{% block content %}{% endblock %}</div><button id="replay-guide-btn" class="replay-guide-btn" type="button" title="重新查看新手引导">？<span>新手引导</span></button>
<aside class="career-music" id="career-music" aria-label="职业岛屿背景音乐">
  <audio id="career-music-audio" src="/static/audio/exploration-theme.ogg" loop preload="metadata"></audio>
  <button class="career-music-toggle" id="career-music-toggle" type="button" aria-pressed="false" aria-label="播放背景音乐">
    <span class="music-disc" aria-hidden="true"><i class="music-eye eye-left"></i><i class="music-eye eye-right"></i><i class="music-smile"></i><em>♪</em></span>
    <span class="music-copy"><b>星星唱机</b><small>点击唤醒音乐</small></span>
  </button>
  <button class="career-music-settings" id="career-music-settings" type="button" aria-expanded="false" aria-label="打开音乐设置"><svg viewBox="0 0 24 24"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/></svg></button>
  <div class="career-music-panel" id="career-music-panel"><label for="career-music-volume">岛屿音乐 <b id="career-music-percent">28%</b></label><input id="career-music-volume" type="range" min="0" max="1" step="0.05" value="0.28"><small>让音乐陪你探索每一座职业小岛</small></div>
</aside>
<div id="font-size-control" class="font-size-control" role="group" aria-label="调节字体大小">
  <button id="font-smaller" class="font-size-btn" type="button" title="缩小字体" aria-label="缩小字体">A<sup>-</sup></button>
  <button id="font-default" class="font-size-btn font-size-active" type="button" title="默认字体" aria-label="默认字体">A</button>
  <button id="font-larger" class="font-size-btn" type="button" title="放大字体" aria-label="放大字体">A<sup>+</sup></button>
</div>
<script>
(function(){
  var SCALES = {smaller: 14, default: 16, larger: 18};
  var saved = localStorage.getItem('font-size-scale');
  if (saved && SCALES[saved]) { document.documentElement.style.fontSize = SCALES[saved] + 'px'; }
  function setScale(name) {
    document.documentElement.style.fontSize = SCALES[name] + 'px';
    localStorage.setItem('font-size-scale', name);
    document.querySelectorAll('.font-size-btn').forEach(function(b){ b.classList.remove('font-size-active'); });
    document.getElementById('font-' + name).classList.add('font-size-active');
  }
  document.getElementById('font-smaller').addEventListener('click', function(){ setScale('smaller'); });
  document.getElementById('font-default').addEventListener('click', function(){ setScale('default'); });
  document.getElementById('font-larger').addEventListener('click', function(){ setScale('larger'); });

  var ctrl = document.getElementById('font-size-control');
  // 情境页使用独立且带版本的坐标，避免继续读取旧版左下角遮挡台词的位置。
  var positionKey = document.body.classList.contains('page-scenario') ? 'font-size-pos-scenario-v2' : 'font-size-pos';
  var savedPos = localStorage.getItem(positionKey);
  if (savedPos) {
    try {
      var p = JSON.parse(savedPos);
      var safeLeft = Math.max(0, Math.min(window.innerWidth - ctrl.offsetWidth, Number(p.l) || 0));
      var safeTop = Math.max(0, Math.min(window.innerHeight - ctrl.offsetHeight, Number(p.t) || 0));
      ctrl.style.left = safeLeft + 'px'; ctrl.style.top = safeTop + 'px'; ctrl.style.bottom = 'auto';
    } catch (_) { localStorage.removeItem(positionKey); }
  }

  var dragging = false, startX, startY, startLeft, startTop;
  function onStart(e) {
    if (e.target.tagName === 'BUTTON') return;
    e.preventDefault();
    dragging = true; ctrl.style.cursor = 'grabbing'; ctrl.style.transition = 'none';
    var pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX; startY = pt.clientY;
    var rect = ctrl.getBoundingClientRect();
    startLeft = rect.left; startTop = rect.top;
    ctrl.style.left = startLeft + 'px'; ctrl.style.top = startTop + 'px'; ctrl.style.bottom = 'auto';
  }
  function onMove(e) {
    if (!dragging) return;
    e.preventDefault();
    var pt = e.touches ? e.touches[0] : e;
    var dx = pt.clientX - startX, dy = pt.clientY - startY;
    var nl = Math.max(0, Math.min(window.innerWidth - ctrl.offsetWidth, startLeft + dx));
    var nt = Math.max(0, Math.min(window.innerHeight - ctrl.offsetHeight, startTop + dy));
    ctrl.style.left = nl + 'px'; ctrl.style.top = nt + 'px';
  }
  function onEnd() {
    if (!dragging) return;
    dragging = false; ctrl.style.cursor = 'grab'; ctrl.style.transition = '';
    localStorage.setItem(positionKey, JSON.stringify({l: parseInt(ctrl.style.left), t: parseInt(ctrl.style.top)}));
  }
  ctrl.addEventListener('mousedown', onStart);
  ctrl.addEventListener('touchstart', onStart, {passive: false});
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, {passive: false});
  document.addEventListener('mouseup', onEnd);
  document.addEventListener('touchend', onEnd);
})();
</script>
<script src="/static/js/app.js?v=career-cinematic-v10"></script>
{% block extra_js %}{% endblock %}</body>
</html>
