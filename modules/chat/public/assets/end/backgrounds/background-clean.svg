<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">

<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fffaf4"/>
    <stop offset="0.62" stop-color="#fffdf8"/>
    <stop offset="1" stop-color="#eef8d4"/>
  </linearGradient>
  <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d9f1a9"/>
    <stop offset="1" stop-color="#9fd56f"/>
  </linearGradient>
  <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c8e996"/>
    <stop offset="1" stop-color="#87c65e"/>
  </linearGradient>
  <filter id="blurSoft">
    <feGaussianBlur stdDeviation="9"/>
  </filter>
</defs>

<rect width="1672" height="941" fill="url(#sky)"/>

<!-- soft light -->
<ellipse cx="830" cy="230" rx="620" ry="310" fill="#ffffff" opacity="0.25" filter="url(#blurSoft)"/>

<!-- distant bushes -->
<path d="M0 590
  C80 545 150 560 220 590
  C290 535 360 550 430 590
  C500 550 570 557 650 594
  L650 705 L0 705 Z"
  fill="#bfe1b4" opacity=".76"/>
<path d="M1110 590
  C1190 545 1265 562 1325 590
  C1390 540 1470 548 1540 590
  C1600 560 1640 570 1672 590
  L1672 705 L1110 705 Z"
  fill="#b8dfa7" opacity=".76"/>

<!-- meadow -->
<path d="M0 610
  C230 560 430 610 620 665
  C845 725 1080 650 1260 615
  C1425 580 1560 600 1672 640
  L1672 941 L0 941 Z"
  fill="url(#hill1)"/>
<path d="M0 730
  C240 650 445 720 650 762
  C870 807 1115 730 1325 700
  C1490 676 1590 695 1672 730
  L1672 941 L0 941 Z"
  fill="url(#hill2)" opacity=".75"/>

<!-- left leaves -->
<g transform="translate(0,530)">
  <path d="M42 300 C35 216 52 120 105 45" fill="none" stroke="#4f9f61" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="58" cy="235" rx="27" ry="55" transform="rotate(-34 58 235)" fill="#6db56f"/>
  <ellipse cx="85" cy="184" rx="25" ry="52" transform="rotate(28 85 184)" fill="#8bc97c"/>
  <ellipse cx="103" cy="122" rx="22" ry="48" transform="rotate(-24 103 122)" fill="#5fae68"/>
  <ellipse cx="120" cy="74" rx="21" ry="43" transform="rotate(25 120 74)" fill="#92cf7c"/>
</g>

<!-- right leaves -->
<g transform="translate(1510,510)">
  <path d="M88 344 C96 242 70 140 16 45" fill="none" stroke="#4f9961" stroke-width="13" stroke-linecap="round"/>
  <ellipse cx="74" cy="272" rx="28" ry="58" transform="rotate(34 74 272)" fill="#75ba70"/>
  <ellipse cx="56" cy="204" rx="26" ry="54" transform="rotate(-29 56 204)" fill="#5ea968"/>
  <ellipse cx="33" cy="139" rx="24" ry="50" transform="rotate(28 33 139)" fill="#8ac979"/>
  <ellipse cx="14" cy="79" rx="22" ry="46" transform="rotate(-28 14 79)" fill="#68af6a"/>
</g>

<!-- flowers -->
<g transform="translate(12,765)">
  <path d="M46 164 L62 36" stroke="#4d9a5e" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="48" cy="98" rx="17" ry="30" transform="rotate(-35 48 98)" fill="#69ad68"/>
  <ellipse cx="64" cy="125" rx="17" ry="30" transform="rotate(35 64 125)" fill="#79bb70"/>
  <g transform="translate(62,32)">
    <ellipse cx="-16" cy="0" rx="17" ry="39" transform="rotate(-30)" fill="#ef6945"/>
    <ellipse cx="16" cy="0" rx="17" ry="39" transform="rotate(30)" fill="#f47b4e"/>
    <ellipse cx="0" cy="-14" rx="17" ry="39" fill="#f15f3d"/>
  </g>
</g>

<g transform="translate(1320,735)">
  <path d="M40 155 L50 45" stroke="#5da264" stroke-width="8" stroke-linecap="round"/>
  <g transform="translate(50,43)">
    <circle r="14" fill="#f3bd43"/>
    <ellipse cx="-22" cy="0" rx="20" ry="12" fill="#fffdf5"/>
    <ellipse cx="22" cy="0" rx="20" ry="12" fill="#fffdf5"/>
    <ellipse cx="0" cy="-22" rx="12" ry="20" fill="#fffdf5"/>
    <ellipse cx="0" cy="22" rx="12" ry="20" fill="#fffdf5"/>
  </g>
</g>

<!-- tiny flowers and dots -->
<g fill="#fffdf5" opacity=".95">
  <circle cx="220" cy="822" r="5"/><circle cx="245" cy="810" r="4"/>
  <circle cx="340" cy="860" r="5"/><circle cx="376" cy="846" r="4"/>
  <circle cx="1205" cy="852" r="5"/><circle cx="1270" cy="825" r="4"/>
</g>
<g fill="#ffd570">
  <circle cx="286" cy="802" r="5"/><circle cx="1150" cy="810" r="5"/>
  <circle cx="1420" cy="760" r="4"/>
</g>

</svg>