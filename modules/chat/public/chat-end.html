@media(max-width:1280px){body{overflow:auto}.end-scene{grid-template-columns:190px minmax(0,1fr);grid-template-rows:auto auto auto auto}.end-hero{grid-column:1/-1;padding-left:210px}.end-mascot-area{grid-column:1;grid-row:2}.end-summary-card{grid-column:2;grid-row:2}.end-tomorrow-note{grid-column:1/-1;grid-row:3;min-height:auto}.end-note-content{display:grid;grid-template-columns:1.2fr repeat(3,1fr);align-items:center;gap:12px}.end-note-content h2{margin:0}.end-note-content p{margin:0;padding:0 12px;border-bottom:0;border-left:1px solid rgba(255,255,255,.12)}.end-bottom-actions{grid-row:4;grid-template-columns:repeat(4,minmax(0,1fr))}}

      <div class="end-encourage" id="endEncourage"><span class="end-enc-icon">⭐</span><span class="end-enc-text">你今天很棒，愿意分享自己的想法和感受！</span></div>
    </article>
    <aside class="end-tomorrow-note">
      <img class="end-note-bg" src="assets/end/ui/note-paper.svg" alt="">
      <div class="end-note-tape"><img src="assets/end/ui/green-tape.svg" alt=""></div>
      <div class="end-note-content"><h2>怎样算完成一次？</h2><p>至少发送 1 条消息，</p><p>再点击“结束聊天”。</p><p>从探索星球进入，会自动保存到“我的作品”。</p></div>
    </aside>
    <nav class="end-bottom-actions">
      <a class="end-action-card" href="/home.html"><img class="end-act-bg" src="assets/end/ui/action-card-bg.svg" alt=""><span class="end-act-icon">🏠</span><span class="end-act-text"><strong>返回首页</strong><small>回到小新家</small></span></a>
      <a class="end-action-card" href="/journal.html"><img class="end-act-bg" src="assets/end/ui/action-card-bg.svg" alt=""><span class="end-act-icon">📔</span><span class="end-act-text"><strong>写手账</strong><small>记录今天的心情</small></span></a>
      <a class="end-action-card" href="http://localhost:4173/?view=works"><img class="end-act-bg" src="assets/end/ui/action-card-bg.svg" alt=""><span class="end-act-icon">📚</span><span class="end-act-text"><strong>查看我的作品</strong><small>回看本次聊天观察</small></span></a>
      <button class="end-action-card" id="btnRestart" type="button"><img class="end-act-bg" src="assets/end/ui/action-card-bg.svg" alt=""><span class="end-act-icon">💬</span><span class="end-act-text"><strong>继续和小新聊天</strong><small>再聊一会儿吧</small></span></button>
    </nav>
  </section>

  <script>
(function() {
  var params = new URLSearchParams(location.search);
  var turnCount = parseInt(params.get('turns')) || 0;
  var msgCount  = parseInt(params.get('msgs')) || 0;
  var weather   = params.get('weather') || '';
  var weatherLabel = params.get('weatherLabel') || '';

  // 天气 emoji 映射（和 chat.html 的 populateEndOverlay 一致）
  var wm = {sunny:'☀️',cloudy:'☁️',storm:'⛈️',rainbow:'🌈',breeze:'🍃',lightrain:'🌧️',snow:'❄️',fog:'🌫️',moon:'🌙',sparkle:'🌀',custom:'🌀'};
  var wl = {sunny:'晴空万里',cloudy:'有点沉闷',storm:'十分烦躁',rainbow:'开心到发光',breeze:'轻松自在',lightrain:'有点小难过'};
  var wi = weather ? (wm[weather] || '💗') : '💗';
  var wt = weather ? (wl[weather] || weatherLabel || '自定义') : (weatherLabel || '未选择');

  // 小新头像
  var mi = document.getElementById('endMascotImg');
  if (mi && window.getXiaoxinAvatar) mi.src = getXiaoxinAvatar();
  var sb = document.getElementById('endStudentBadge');
  if (sb && window.getStudentAvatar) sb.src = getStudentAvatar();

  // 填充数据
  var wd = document.getElementById('endWeatherDisplay'); if (wd) wd.textContent = wi;
  var tc = document.getElementById('endTurnCount');       if (tc) tc.textContent = turnCount;
  var mc = document.getElementById('endMsgCount');        if (mc) mc.textContent = msgCount;
  var me = document.getElementById('endMoodEmoji');       if (me) me.textContent = wi;
  var ml = document.getElementById('endMoodLabel');       if (ml) ml.textContent = wt;

  // 星星数量
  var s = 0; if (turnCount >= 3) s = 1; if (turnCount >= 6) s = 2; if (turnCount >= 10) s = 3;
  var es = document.getElementById('endStars'); if (es) es.textContent = s;

  // 鼓励语
  var ee = document.getElementById('endEncourage');
  if (ee) {
    var gm = ['每一次聊天都是一次成长！','你今天很棒，愿意分享自己的想法和感受！','能和你说说话，小新也觉得很开心！','你是个特别有想法的人，记得要相信自己！'];
    var p = turnCount <= 2 ? 0 : (turnCount <= 6 ? 1 : (turnCount <= 10 ? 2 : 3));
    var et = ee.querySelector('.end-enc-text');
    if (et) et.textContent = gm[p];
  }

  // "继续和小新聊天" 按钮：写 sessionStorage 标记再跳转
  var btn = document.getElementById('btnRestart');
  if (btn) btn.addEventListener('click', function() {
    sessionStorage.setItem('xiaoxin_is_continue', '1');
    if (weather) sessionStorage.setItem('xiaoxin_weather_selected', weather);
    if (weatherLabel) sessionStorage.setItem('xiaoxin_weather_label', weatherLabel);
    location.href = '/chat.html';
  });
})();
  </script>
</body>
</html>
