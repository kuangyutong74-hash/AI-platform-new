<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麦克风诊断</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; margin: 0; padding: 24px; background: #faf6f0; color: #333; }
  h1 { font-size: 20px; }
  #btn { display: block; width: 100%; padding: 16px; font-size: 18px; border: none; border-radius: 12px;
         background: #b8632c; color: #fff; cursor: pointer; margin: 16px 0; }
  #btn:hover { background: #a05220; }
  .item { background: #fff; border-radius: 10px; padding: 12px 16px; margin: 10px 0; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .ok { color: #1a7f37; font-weight: bold; }
  .bad { color: #c62828; font-weight: bold; }
  .warn { color: #b26a00; font-weight: bold; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 13px; margin: 4px 0; }
  .tip { font-size: 13px; color: #777; margin-top: 8px; }
</style>
</head>
<body>
<h1>🔍 麦克风诊断（请点击下方按钮，然后把本页显示的结果告诉我）</h1>
<div class="item"><b>浏览器：</b><span id="ua"></span></div>
<button id="btn">点我：一键诊断麦克风</button>
<div id="results"></div>
<div class="tip">诊断按钮的点击同时满足浏览器「用户激活」要求，结果真实可靠。全部步骤约需 5 秒。</div>
<script>
document.getElementById('ua').textContent = navigator.userAgent;

function add(title, text, cls) {
  var d = document.createElement('div');
  d.className = 'item';
  var t = document.createElement('div');
  t.innerHTML = '<b>' + title + '：</b>';
  if (cls) {
    var s = document.createElement('span');
    s.className = cls;
    s.textContent = text;
    t.appendChild(s);
  } else {
    t.appendChild(document.createTextNode(text));
  }
  d.appendChild(t);
  document.getElementById('results').appendChild(d);
  return d;
}

document.getElementById('btn').addEventListener('click', function () {
  var box = document.getElementById('results');
  box.innerHTML = '';

  // 1. mediaDevices 是否存在（http 非安全上下文会没有）
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    add('mediaDevices API', '不存在！页面必须用 http://localhost:3000 打开（localhost 才是安全上下文）', 'bad');
    return;
  }
  add('mediaDevices API', '存在 ✓', 'ok');

  // 2. 设备枚举
  navigator.mediaDevices.enumerateDevices().then(function (devs) {
    var ins = devs.filter(function (d) { return d.kind === 'audioinput'; });
    var out = devs.filter(function (d) { return d.kind === 'audiooutput'; });
    var lines = [];
    devs.forEach(function (d) { lines.push(d.kind + ' | ' + (d.label || '(无权限时隐藏名称)')); });
    var d1 = add('系统可见的设备（共 ' + devs.length + ' 个：录音 ' + ins.length + ' / 播放 ' + out.length + '）', '', '');
    var pre = document.createElement('pre');
    pre.textContent = lines.join('\n');
    d1.appendChild(pre);
    if (ins.length === 0) {
      add('录音设备', '浏览器枚举不到任何麦克风——这就是没有权限弹窗的原因', 'bad');
    } else {
      add('录音设备', '枚举到 ' + ins.length + ' 个麦克风 ✓', 'ok');
    }

    // 3. 权限状态
    navigator.permissions.query({ name: 'microphone' }).then(function (p) {
      var cls = p.state === 'granted' ? 'ok' : (p.state === 'denied' ? 'bad' : 'warn');
      add('麦克风权限状态', p.state + (p.state === 'denied' ? '（被浏览器拒绝——点地址栏锁图标改允许）' : ''), cls);

      // 4. 实际申请麦克风（本次点击仍在用户激活窗口内）
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
        var tracks = stream.getAudioTracks();
        var names = tracks.map(function (t) { return t.label || '(匿名)'; }).join('、');
        add('实际申请麦克风', '成功 ✓ 打开的设备：' + names, 'ok');
        tracks.forEach(function (t) { t.stop(); });
      }).catch(function (e) {
        add('实际申请麦克风', '失败：' + e.name + ' — ' + e.message, 'bad');
        if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
          add('结论', '浏览器层面拒绝了。请点地址栏左侧锁图标 → 麦克风 → 改为「允许」→ 再点一次本按钮。若锁图标列表里没有麦克风项，说明系统层面没给浏览器提供任何麦克风设备（查看 Windows 设置 → 隐私和安全性 → 麦克风 是否开启；或设备管理器中 Realtek 声卡是否正常）。', 'warn');
        } else if (e.name === 'NotFoundError') {
          add('结论', '系统没有任何可用的麦克风设备。', 'bad');
        }
      });
    }).catch(function (e) {
      add('权限查询', '失败：' + e.message, 'bad');
    });
  }).catch(function (e) {
    add('设备枚举', '失败：' + e.name + ' — ' + e.message, 'bad');
  });
});
</script>
</body>
</html>
