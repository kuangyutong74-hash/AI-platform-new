<html lang="zh-CN">
<head>

  <style>
/* ============================================================
   以下完全来自 xiaoxin-chat-interface-complete-demo/style.css
   ============================================================ */
:root{
  --brown:#51291f;--brown2:#7d5749;--brown3:#a18477;
  --orange:#ff7640;--orange2:#f15d2d;--cream:#fffaf4;
  --line:rgba(100,58,41,.13);--line2:rgba(100,58,41,.20);
  --soft:0 8px 20px rgba(95,63,44,.08);--card:0 15px 36px rgba(95,63,44,.11);
}
*{box-sizing:border-box}
html,body{width:100%;height:100%}
body{margin:0;min-width:320px;overflow:hidden;color:var(--brown);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#dceff7}
button,textarea,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid rgba(255,118,64,.28);outline-offset:2px}
.app-shell{width:100%;height:100vh;padding:8px;background:linear-gradient(rgba(235,249,255,.56),rgba(255,249,240,.56)),url("assets/backgrounds/app-background-clean.svg") center/cover no-repeat}
.app-frame{width:100%;height:100%;overflow:hidden;border:2px solid rgba(255,255,255,.88);border-radius:27px;background:rgba(255,251,246,.94);box-shadow:0 20px 60px rgba(62,84,89,.16);backdrop-filter:blur(9px)}

/* ---- Topbar ---- */
.topbar{height:72px;display:grid;grid-template-columns:260px minmax(0,1fr) auto;align-items:center;border-bottom:1px solid var(--line);background:rgba(255,249,243,.96)}
.brand{height:100%;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:18px;font-weight:950}
.brand-logo{width:52px;height:52px;display:grid;place-items:center;overflow:hidden;border-radius:50%;background:#fff;box-shadow:var(--soft)}
.brand-logo img{width:50px;height:50px;object-fit:contain}
.page-title{height:100%;display:flex;align-items:center;gap:10px;font-size:20px;font-weight:950}.page-title img{width:26px;height:26px}
.weather-badge{display:inline-flex;align-items:center;margin-left:2px}
.weather-badge svg{stroke:#587594}
.top-actions{height:100%;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 16px}
.top-button{min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;border:1px solid var(--line2);border-radius:16px;background:#fffdfa;box-shadow:0 6px 16px rgba(98,62,42,.06);font-size:15px;font-weight:900;cursor:pointer;transition:.16s}
.top-button img{width:22px;height:22px}.top-button:hover{transform:translateY(-2px);box-shadow:0 10px 23px rgba(98,62,42,.10)}.top-button.danger{color:#d94821;border-color:rgba(241,93,45,.72)}

.workspace{height:calc(100% - 72px);display:grid;grid-template-columns:minmax(500px,1fr) 110px;background:rgba(255,253,249,.80)}

/* ===== Main Panel — 去掉了hero，直接就是聊天 ===== */
.main-panel{min-width:0;min-height:0;overflow:hidden}

/* ===== Chat Section — 填满主面板 ===== */
.chat-section{height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column}
.chat-bg{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover}

/* ---- Messages ---- */
.messages{flex:1;position:relative;z-index:2;overflow-y:auto;padding:20px 36px 190px;scrollbar-width:thin;scrollbar-color:#8f8a86 transparent}
.messages::-webkit-scrollbar{width:5px}
.messages::-webkit-scrollbar-track{background:transparent}
.messages::-webkit-scrollbar-thumb{background:#dec9b8;border-radius:4px}

/* ---- Message Row ---- */
.message-row{display:flex;align-items:flex-end;gap:9px;flex-shrink:0;margin-bottom:10px}
.message-row.user{justify-content:flex-end}
.message-avatar{width:54px;height:54px;flex:0 0 auto;display:grid;place-items:center;overflow:hidden;border-radius:50%;background:#fff8f0}
.message-avatar img{width:66px;height:66px;object-fit:contain}
.message-avatar.student{width:58px;height:58px;background:#eef8ff}
.message-avatar.student img{width:52px;height:62px;object-fit:contain}

/* ---- Bubble ---- */
.message-bubble{max-width:min(480px,58%);height:auto;min-height:0;overflow:visible;padding:12px 15px 11px;border:1px solid rgba(221,162,120,.58);border-radius:22px 22px 22px 7px;color:#664033;background:#fff7f0;box-shadow:0 7px 16px rgba(95,63,44,.05);line-height:1.55;word-break:break-word;position:relative}
.message-bubble .bubble-text{font-size:15px;line-height:1.6}
.message-row.user .message-bubble{border-color:rgba(88,169,220,.52);border-radius:22px 22px 7px 22px;background:#e8f5ff}
.message-bubble time{display:block;margin-top:4px;text-align:right;color:#a68d82;font-size:11px}
/* 消息列表容器 */
#messageList{width:100%}

/* ---- Animations ---- */
@keyframes bubbleIn{from{opacity:0;transform:translateY(14px) scale(0.93)}to{opacity:1;transform:translateY(0) scale(1)}}
.message-row{animation:bubbleIn .35s ease-out}

/* ---- Typing ---- */
.typing-dots{display:flex;gap:5px;padding:4px 2px}
.typing-dots span{width:7px;height:7px;background:#c09080;border-radius:50%;animation:dotBounce 1.3s infinite ease-in-out}
.typing-dots span:nth-child(2){animation-delay:.18s}
.typing-dots span:nth-child(3){animation-delay:.36s}
@keyframes dotBounce{0%,80%,100%{transform:scale(0.5);opacity:.35}40%{transform:scale(1);opacity:1}}

/* ---- Speak button — 放在气泡外面 ---- */
.speak-btn{width:30px;height:30px;flex:0 0 auto;display:none;align-items:center;justify-content:center;border:none;border-radius:50%;background:rgba(255,248,240,.85);color:#a07060;cursor:pointer;transition:all .2s;padding:0}
.message-row:hover .speak-btn,.speak-btn.playing{display:flex}
.speak-btn:hover{background:#fff0e6;color:var(--orange)}
.speak-btn.playing{display:flex;color:var(--orange);background:#fff0e6}
.speak-btn svg{width:13px;height:13px}

/* ---- Composer ---- */
.composer-wrap{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:0 36px 20px;background:linear-gradient(180deg,rgba(255,253,249,0),rgba(255,253,249,.88) 24%,rgba(255,253,249,.99) 52%)}
.quick-replies{display:flex;justify-content:center;gap:8px;overflow-x:auto;padding:14px 0 10px;scrollbar-width:none}
.quick-replies::-webkit-scrollbar{display:none}
.quick-replies button{min-height:35px;flex:0 0 auto;padding:0 15px;border:1px solid rgba(130,94,76,.18);border-radius:999px;color:#8d6d60;background:#fffdfa;cursor:pointer;font-size:14px}
.quick-replies button:hover{background:#fff4ea}
.composer{min-height:70px;display:grid;grid-template-columns:32px minmax(0,1fr) auto 50px;align-items:center;gap:10px;padding:10px 10px 10px 20px;border:2px solid rgba(244,151,108,.45);border-radius:999px;background:rgba(255,255,255,.96);box-shadow:0 14px 34px rgba(102,66,45,.10)}
.composer:focus-within{border-color:rgba(255,118,64,.55);box-shadow:0 14px 38px rgba(102,66,45,.15)}
.composer .btn-mic{width:32px;height:32px;padding:0;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#b8a898;transition:color .25s}
.composer .btn-mic img{width:24px;height:24px}
.composer .btn-mic:hover{color:var(--orange)}
.composer .btn-mic.listening{color:#e04040;animation:micPulse 1s infinite}
.composer .btn-mic.disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
@keyframes micPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.composer textarea{min-width:0;max-height:160px;resize: none;overflow-y:auto;border:0;outline:0;background:transparent;font-size:16px;line-height:1.45;color:var(--brown);font-family:inherit}
.composer textarea::placeholder{color:#9b8f8c}
.character-count{color:#a58b7f;font-size:12px;white-space:nowrap}
.send-button{width:50px;height:50px;padding:0;border:0;border-radius:50%;background:transparent;cursor:pointer;transition:transform .15s}
.send-button:hover{transform:scale(1.06)}
.send-button img{width:50px;height:50px}
.send-button:disabled{opacity:.4;cursor:not-allowed}

/* ---- Roadmap Panel ---- */
.roadmap-panel{min-width:0;min-height:0;overflow:hidden;border-left:1px solid var(--line);background:rgba(255,249,243,.95)}
.roadmap-panel h2{margin:12px 0 8px;text-align:center;color:#a88a7a;font-size:14px;font-weight:700}
.roadmap-list{height:calc(100% - 44px);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding:4px 8px 12px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#dec9b8 transparent}
.roadmap-list::-webkit-scrollbar{width:5px}
.roadmap-list::-webkit-scrollbar-thumb{background:#dec9b8;border-radius:4px}
.roadmap-step{width:100%;flex:0 0 auto;position:relative;display:grid;justify-items:center;gap:5px;padding:4px 3px;border:0;background:transparent;color:#aa958b;cursor:pointer;transition:color .3s}
.roadmap-step:not(:last-child)::after{content:"";width:5px;height:18px;position:absolute;left:calc(50% - 2.5px);top:calc(100% - 3px);border-radius:999px;background:linear-gradient(#f2c7c1,#d3b8e9,#badba6);opacity:.75}
.roadmap-icon{width:44px;height:44px;display:grid;place-items:center;border-radius:15px;background:rgba(255,255,255,.72)}
.roadmap-icon img{width:32px;height:32px}
.roadmap-step strong{font-size:12px;font-weight:700;line-height:1.25}
.roadmap-step.lit{color:#d94821}
.roadmap-step.lit .roadmap-icon{background:#fff0e6;box-shadow:var(--soft)}

/* ---- Modals ---- */
.modal-backdrop{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:rgba(63,51,45,.44);backdrop-filter:blur(7px)}.modal-backdrop.hidden{display:none}
.modal-card{width:min(720px,100%);position:relative;padding:42px 38px 36px;border:2px solid rgba(255,255,255,.90);border-radius:34px;text-align:center;background:#fffdf9;box-shadow:0 28px 86px rgba(44,31,25,.26)}
.modal-close{width:42px;height:42px;position:absolute;right:20px;top:18px;border:1px solid var(--line);border-radius:50%;background:#fff;font-size:25px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;color:#a09080}
.modal-close:hover{border-color:#d94821;color:#d94821}
.modal-sticker{font-size:46px}
.modal-card h2{margin:11px 0 8px;font-size:29px;font-weight:950;color:var(--brown)}
.modal-card>p{margin:0;color:var(--brown2);line-height:1.7;font-size:15px}
.mood-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.mood-grid button{min-height:78px;padding:10px;border:1px solid var(--line);border-radius:21px;background:#fff9f4;font-weight:850;cursor:pointer;font-size:16px;color:var(--brown)}
.mood-grid button:hover{border-color:rgba(255,118,64,.50);background:#fff1e7}
.mood-grid button.selected{border-color:rgba(255,118,64,.60);background:#fff1e7;box-shadow:0 6px 18px rgba(255,118,64,.15)}

/* ---- Mic permission modal ---- */
#micPermText{max-width:560px;margin:0 auto}
.modal-card .mic-perm-hint{margin-top:10px;color:var(--brown3);font-size:13px}
.mic-perm-actions{display:flex;justify-content:center;gap:14px;margin-top:26px}
.mic-perm-actions button{min-width:150px;min-height:52px;padding:0 26px;border-radius:999px;font-size:17px;font-weight:900;cursor:pointer;transition:.16s}
.mic-btn-allow{border:0;color:#fff;background:linear-gradient(135deg,var(--orange),var(--orange2));box-shadow:0 8px 20px rgba(255,118,64,.32)}
.mic-btn-allow:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(255,118,64,.42)}
.mic-btn-later{border:1px solid var(--line2);color:var(--brown2);background:#fffdfa}
.mic-btn-later:hover{border-color:#d94821;color:#d94821}

/* ---- Weather badge ---- */
.weather-badge{display:inline-flex;align-items:center;margin-left:2px}
.weather-badge svg{stroke:#587594}

/* ===== Responsive ===== */
@media(max-width:1500px){.topbar{grid-template-columns:240px minmax(0,1fr) auto}.workspace{grid-template-columns:minmax(440px,1fr) 95px}.top-button{min-height:38px;padding:0 12px;font-size:13px}.messages{padding-inline:28px}.composer-wrap{padding-inline:28px}}
@media(max-width:1180px){.topbar{grid-template-columns:200px minmax(0,1fr) auto}.workspace{grid-template-columns:minmax(380px,1fr) 85px}.top-actions{gap:5px;padding-inline:6px}.top-button span{display:none}.top-button{width:38px;min-height:38px;padding:0}.messages{padding-inline:20px}.composer-wrap{padding-inline:20px}.message-bubble{max-width:min(420px,62%)}.mood-grid{grid-template-columns:repeat(2,1fr)}.mood-grid button{min-height:64px}}
@media(max-width:900px){
  body{overflow:auto}.app-shell{min-height:100vh;height:auto;padding:0}.app-frame{min-height:100vh;height:auto;border-radius:0}.topbar{height:auto;grid-template-columns:1fr auto;padding:10px 12px}.brand{padding:0}.page-title{display:none}
  .workspace{min-height:calc(100vh - 76px);height:auto;grid-template-columns:1fr}.roadmap-panel{display:none}
  .main-panel{min-height:calc(100vh - 76px)}.messages{padding:24px 16px 195px}.message-bubble{max-width:calc(100% - 67px)}.composer-wrap{padding:0 14px 16px}.quick-replies{justify-content:flex-start}.composer{grid-template-columns:28px minmax(0,1fr) 46px;min-height:64px;padding-left:15px}.character-count{display:none}.send-button,.send-button img{width:46px;height:46px}
}
@media(max-width:560px){.brand strong{display:none}.brand-logo{width:43px;height:43px}.brand-logo img{width:41px;height:41px}.top-actions{gap:4px}.top-button{width:36px;min-height:36px}.top-button img{width:20px;height:20px}.message-avatar{width:42px;height:42px}.message-avatar img{width:52px;height:52px}.message-avatar.student{width:46px;height:46px}.message-avatar.student img{width:42px;height:49px}.message-bubble{padding:13px 14px;border-radius:18px 18px 18px 6px}.message-bubble .bubble-text{font-size:13px}.message-row.user .message-bubble{border-radius:18px 18px 6px 18px}.mood-grid{grid-template-columns:1fr 1fr}.modal-card{padding-inline:20px}}
  </style>

// 仅在"全新对话"（分支4）时重新生成。这样 wasWeatherChosen() 始终反映

// ===== Resume init =====

function tryRestoreMessages(data){
  if(!data||!data.messages||data.messages.length===0)return false;
  messages=data.messages.map(function(m){return{role:m.role,content:m.content||''}});
  turnCount=data.turnCount||messages.filter(function(m){return m.role==='user'}).length;

  messageList.innerHTML='';
  messages.forEach(function(m){addBubble(m.role,m.content)});
  weatherOverlay.classList.add('hidden');

  refreshQuickTopics();
  msgInput.focus();

(async function(){
  // 分支 1：从历史记录链接进入（带 convId）→ 加载指定历史对话
  if(resumingConvId){
    weatherOverlay.classList.add('hidden');
    try{
      var r=await fetch('/api/history/'+resumingConvId),d=await r.json();
      if(tryRestoreMessages(d)){
        // 把历史消息同步到新的 session，确保后续对话保存在新 session 下
        await fetch('/api/session/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:sessionId,messages:messages})});
        return;
      }
    }catch(_){}
    // convId 恢复失败 → 降级为新对话
  }

  // 分支 1.5：从首页"和小新聊聊天"进入（URL 带 ?new=1）→ 强制全新对话
  var isNewChat = urlParams.get('new') === '1';
  if (isNewChat && !resumingConvId) {
    // 清理 URL，移除 new 参数（避免刷新时重复触发）
    if (history.replaceState) history.replaceState(null, '', location.pathname);
    // 强制全新对话：清除所有旧状态，展示心情卡片
    newChatKey();
    sessionStorage.removeItem('xiaoxin_msg_backup');
    sessionStorage.removeItem('xiaoxin_weather_chosen');
    sessionStorage.removeItem('xiaoxin_weather_selected');
    sessionStorage.removeItem('xiaoxin_weather_label');
    sessionStorage.removeItem(XIAOXIN_SESSION_FINALIZED_KEY);
    sessionStorage.removeItem('xiaoxin_is_continue');
    sessionStorage.removeItem('xiaoxin_quick_topics_cache');
    sessionStorage.setItem(XIAOXIN_ACTIVE_SESSION_KEY, sessionId);
    weatherOverlay.classList.remove('hidden');
    return;
  }

  var isContinue = sessionStorage.getItem('xiaoxin_is_continue')==='1';
  var isFinalized = sessionStorage.getItem(XIAOXIN_SESSION_FINALIZED_KEY)==='1';
  var hasActiveSession = !!sessionStorage.getItem(XIAOXIN_ACTIVE_SESSION_KEY);
  var backupRaw = sessionStorage.getItem('xiaoxin_msg_backup');
  var hasBackup = !!backupRaw;

  // 分支 2："继续和小新聊天"按钮 → 恢复消息 + 心情 + 衔接语
  if(!resumingConvId && isContinue){
    sessionStorage.removeItem('xiaoxin_is_continue');
    sessionStorage.removeItem(XIAOXIN_SESSION_FINALIZED_KEY);
    // 恢复历史消息
    if(hasBackup){
      try{
        var _bd=JSON.parse(backupRaw);
        if(_bd.messages && _bd.messages.length>0){
          messages=_bd.messages.map(function(m){return{role:m.role,content:m.content||''}});
          turnCount=_bd.turnCount||messages.filter(function(m){return m.role==='user'}).length;
          messageList.innerHTML='';
          messages.forEach(function(m){addBubble(m.role,m.content)});
        }
      }catch(_){}
    }
    // 恢复心情
    if(wasWeatherChosen()){
      selectedWeather=sessionStorage.getItem('xiaoxin_weather_selected')||null;
      weatherLabel=sessionStorage.getItem('xiaoxin_weather_label')||null;
      if(selectedWeather){
        var _icon1=(selectedWeather==='custom')?matchWeatherIcon(weatherLabel||''):selectedWeather;
        weatherBadge.innerHTML=makeBadgeSVG(_icon1);
      }
    }
    weatherOverlay.classList.add('hidden');
    // 追加衔接语
    var _contMsg='我们继续聊吧～刚才说到哪儿啦？';
    addBubble('assistant',_contMsg);messages.push({role:'assistant',content:_contMsg});
    refreshQuickTopics();
    msgInput.focus();
    return;
  }

  // 分支 3：已有活跃会话且未结束 → F5 刷新恢复（不弹心情卡片）
  if(!resumingConvId && !isFinalized && hasActiveSession && hasBackup){
    try{
      var _bd2=JSON.parse(backupRaw);
      if(_bd2.messages && _bd2.messages.length>0){
        messages=_bd2.messages.map(function(m){return{role:m.role,content:m.content||''}});
        turnCount=_bd2.turnCount||messages.filter(function(m){return m.role==='user'}).length;
        messageList.innerHTML='';
        messages.forEach(function(m){addBubble(m.role,m.content)});
      }
    }catch(_){}
    // 恢复心情
    if(wasWeatherChosen()){
      selectedWeather=sessionStorage.getItem('xiaoxin_weather_selected')||null;
      weatherLabel=sessionStorage.getItem('xiaoxin_weather_label')||null;
      if(selectedWeather){
        var _icon2=(selectedWeather==='custom')?matchWeatherIcon(weatherLabel||''):selectedWeather;
        weatherBadge.innerHTML=makeBadgeSVG(_icon2);
      }
    }
    weatherOverlay.classList.add('hidden');
    refreshQuickTopics();
    msgInput.focus();
    return;
  }

  // 分支 3.6：已选过心情但尚无备份消息（刚选完心情就刷新 / 边缘情况）— 跳过心情选择
  if(!resumingConvId && hasActiveSession && wasWeatherChosen() && !hasBackup){
    selectedWeather=sessionStorage.getItem('xiaoxin_weather_selected')||null;
    weatherLabel=sessionStorage.getItem('xiaoxin_weather_label')||null;
    if(selectedWeather){
      var _icon36=(selectedWeather==='custom')?matchWeatherIcon(weatherLabel||''):selectedWeather;
      weatherBadge.innerHTML=makeBadgeSVG(_icon36);
    }
    weatherOverlay.classList.add('hidden');
    refreshQuickTopics();
    msgInput.focus();
    return;
  }

  // 分支 4：全新对话 — 清除旧数据，展示心情选择卡片
  // 生成全新 chatKey，使心情标记与这个新对话关联（旧对话的心情状态不再影响新对话）
  newChatKey();
  sessionStorage.removeItem('xiaoxin_msg_backup');
  sessionStorage.removeItem('xiaoxin_weather_chosen'); // 兼容旧版全局标记
  sessionStorage.removeItem('xiaoxin_weather_selected');
  sessionStorage.removeItem('xiaoxin_weather_label');
  sessionStorage.removeItem(XIAOXIN_SESSION_FINALIZED_KEY);
  sessionStorage.removeItem('xiaoxin_is_continue');
  sessionStorage.removeItem('xiaoxin_quick_topics_cache');
  // 写入新的稳定会话标识（值为当前 sessionId，仅用作"是否存在"的标记）
  sessionStorage.setItem(XIAOXIN_ACTIVE_SESSION_KEY,sessionId);
  // 新对话 + 未选心情 → 展示心情卡片
  weatherOverlay.classList.remove('hidden');
})();

function matchWeatherIcon(t){for(var i=0;i<WEATHER_KEYWORD_MAP.length;i++){for(var j=0;j<WEATHER_KEYWORD_MAP[i].keywords.length;j++){if(t.indexOf(WEATHER_KEYWORD_MAP[i].keywords[j])>=0)return WEATHER_KEYWORD_MAP[i].icon}}return'sparkle'}

function applyWeather(w,l){
  selectedWeather=w;weatherLabel=l||w;

// ===== Quick replies =====
function normalizeTopicItem(item){if(typeof item==='string')return item;if(item&&typeof item==='object')return item.text||item.content||item.title||item.label||item.topic||'';return''}
function showQuickReplies(topicList){
  // 话题永远不消失 — 无论刷新、新建聊天还是继续聊天
  var src=(Array.isArray(topicList)&&topicList.length>=2)?topicList:null;
  var picked=[];
  if(src){
    var arr=[].concat(src);
    while(arr.length>0&&picked.length<3){
      var idx=Math.floor(Math.random()*arr.length);
      var raw=arr.splice(idx,1)[0];
      var txt=normalizeTopicItem(raw);
      if(txt)picked.push(txt);
    }
    // 如果有效话题不够3个，用固定池补足
    if(picked.length<3){
      var pool=[].concat(QUICK_REPLY_POOL);
      while(picked.length<3&&pool.length>0){
        var ri=Math.floor(Math.random()*pool.length);
        picked.push(pool.splice(ri,1)[0]);
      }
    }
  }else{
    var p=[].concat(QUICK_REPLY_POOL);
    for(var i=0;i<3&&p.length>0;i++){
      var idx2=Math.floor(Math.random()*p.length);
      picked.push(p.splice(idx2,1)[0]);
    }
  }
  // 过滤掉可能的空字符串/undefined
  picked=picked.filter(function(v){return v&&String(v).trim()});
  if(!quickReplies)return;
  quickReplies.innerHTML=picked.map(function(v){return'<button type="button">'+v+'</button>'}).join('');
  quickReplies.querySelectorAll('button').forEach(function(ch,idx){
    var topicText=picked[idx];
    ch.addEventListener('click',function(){
      if(!topicText)return;
      msgInput.value=topicText;
      sendMessage();
    });
  });
}

// ===== 动态话题生成（DeepSeek API）+ sessionStorage 缓存 =====
var quickTopicsLoading=false;
var QUICK_TOPICS_CACHE_KEY='xiaoxin_quick_topics_cache';

// 从 sessionStorage 读取缓存的话题（页面刷新后仍可用）
function loadCachedTopics(){
  try{
    var raw=sessionStorage.getItem(QUICK_TOPICS_CACHE_KEY);
    if(!raw)return null;
    var cache=JSON.parse(raw);
    if(cache&&Array.isArray(cache.topics)&&cache.topics.length>=2)return cache.topics;
  }catch(_){}
  return null;
}

// 将 AI 话题写入 sessionStorage 缓存
function saveCachedTopics(topics){
  try{
    sessionStorage.setItem(QUICK_TOPICS_CACHE_KEY,JSON.stringify({topics:topics,ts:Date.now()}));
  }catch(_){}
}

async function fetchQuickTopics(){
  if(quickTopicsLoading)return[];  // 防止并发请求
  quickTopicsLoading=true;
  try{
    var recentMsgs=messages.slice(-6);  // 最近6条消息（约3轮问答）
    var r=await fetch('/api/quick-topics',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({recentMessages:recentMsgs})
    });
    var d=await r.json();
    if(d&&Array.isArray(d.topics)&&d.topics.length>=2){
      saveCachedTopics(d.topics);  // 成功则缓存
      return d.topics;
    }
    return[];
  }catch(_){return[]}
  finally{quickTopicsLoading=false}
}

async function refreshQuickTopics(){
  // 策略：话题永远不消失（刷新/新建/继续聊天后始终可见）
  // 1. 立即展示：优先缓存 → 静态池，确保刷新后不会空白
  // 2. 异步拉取 AI 话题，成功后替换并更新缓存

  // 第一步：立即渲染（同步），确保页面不空白
  var cached=loadCachedTopics();
  if(cached){
    showQuickReplies(cached);
  }else{
    showQuickReplies(); // 展示静态池兜底
  }

  // 第二步：异步拉取 AI 话题，成功后替换
  var topics=await fetchQuickTopics();
  if(topics.length>=2){
    showQuickReplies(topics);
  }
  // 如果 AI 失败：缓存或静态池已经在上方渲染，保持不变即可
}

// ===== Voice input（麦克风模块）=====
// 权限流程：初次点击麦克风 → 弹窗询问「是否允许」→ 点「允许」后记入 localStorage → 本次及后续点击直接语音输入、不再弹窗
// 识别方案：离线 Vosk 优先（本地运行不依赖云端）；语音包缺失时回退系统语音识别
(function(){
  var voskModelPromise=null;
  var recognizing=false,gotFinal=false,lastPartial='';
  var audioCtx=null,mediaStream=null,procNode=null,recognizer=null,silenceTimer=null;
  var statusBar=null,statusTimer=null;

  function voiceToast(msg){
    var t=document.createElement('div');t.textContent=msg;
    t.style.cssText='position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#51291f;color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:9999;pointer-events:none;';
    document.body.appendChild(t);
    setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t)},3000);
  }

  // 常驻状态条：重要提示不自动消失（右上 ✕ 可关闭）——权限修复指引需要用户慢慢看
  function showStatus(msg,autoHideMs){
    if(!statusBar){
      statusBar=document.createElement('div');
      statusBar.style.cssText='position:fixed;bottom:118px;left:50%;transform:translateX(-50%);max-width:92vw;width:max-content;background:#51291f;color:#fff;padding:10px 34px 10px 16px;border-radius:16px;font-size:14px;line-height:1.6;z-index:9999;box-shadow:0 6px 24px rgba(0,0,0,.25);';
      var txt=document.createElement('span');
      var close=document.createElement('span');
      close.textContent='✕';close.style.cssText='position:absolute;top:5px;right:10px;cursor:pointer;font-size:12px;opacity:.75;';
      close.addEventListener('click',hideStatus);
      statusBar.appendChild(txt);statusBar.appendChild(close);
      document.body.appendChild(statusBar);
    }
    statusBar.querySelector('span').textContent=msg;
    statusBar.style.display='';
    if(statusTimer){clearTimeout(statusTimer);statusTimer=null}
    if(autoHideMs)statusTimer=setTimeout(hideStatus,autoHideMs);
  }
  function hideStatus(){
    if(statusBar)statusBar.style.display='none';
    if(statusTimer){clearTimeout(statusTimer);statusTimer=null}
  }

  // ===== 麦克风权限弹窗 =====
  // 初次点击麦克风：先弹窗询问；点「允许」后把同意结果记到 localStorage，以后点击直接语音输入
  var MIC_CONSENT_KEY='xiaoxin_mic_consent';
  var micPermOverlay=null,micPermTitle=null,micPermText=null,micPermHint=null;
  var btnMicAllow=null,btnMicDeny=null,btnMicGotIt=null;

  function initMicPermModal(){
    micPermOverlay=document.getElementById('micPermOverlay');
    micPermTitle=document.getElementById('micPermTitle');
    micPermText=document.getElementById('micPermText');
    micPermHint=document.getElementById('micPermHint');
    btnMicAllow=document.getElementById('btnMicAllow');
    btnMicDeny=document.getElementById('btnMicDeny');
    btnMicGotIt=document.getElementById('btnMicGotIt');
    document.getElementById('btnMicPermClose').addEventListener('click',hideMicPermModal);
    btnMicAllow.addEventListener('click',function(){
      hideMicPermModal();
      try{localStorage.setItem(MIC_CONSENT_KEY,'1')}catch(_){}
      startListening(); // 允许后立刻开始语音输入
    });
    // 「暂时不了」不记录同意，下次点击会重新询问
    btnMicDeny.addEventListener('click',hideMicPermModal);
    btnMicGotIt.addEventListener('click',hideMicPermModal);
  }

  // mode='ask' 询问是否允许；mode='blocked' 浏览器层已拒绝 → 显示修复指引
  function showMicPermModal(mode){
    if(!micPermOverlay)initMicPermModal();
    var blocked=mode==='blocked';
    micPermTitle.textContent=blocked?'麦克风被浏览器阻止了':'允许使用麦克风吗？';
    micPermText.textContent=blocked?MIC_BLOCKED_HELP:'用语音和小新聊天需要打开麦克风。声音只在你自己的电脑上识别，不会上传到网上，请放心～';
    micPermText.style.textAlign=blocked?'left':'center';
    micPermHint.style.display=blocked?'none':'';
    btnMicAllow.style.display=blocked?'none':'';
    btnMicDeny.style.display=blocked?'none':'';
    btnMicGotIt.style.display=blocked?'':'none';
    micPermOverlay.classList.remove('hidden');
  }
  function hideMicPermModal(){if(micPermOverlay)micPermOverlay.classList.add('hidden')}

  function micConsented(){
    try{return localStorage.getItem(MIC_CONSENT_KEY)==='1'}catch(_){return false}
  }

  // 探测浏览器层权限状态（个别浏览器不支持 query，失败返回 null 即可）
  function queryBrowserMicPerm(cb){
    try{
      if(!navigator.permissions||!navigator.permissions.query){cb(null);return}
      navigator.permissions.query({name:'microphone'}).then(function(p){cb(p?p.state:null)},function(){cb(null)});
    }catch(_){cb(null)}
  }

  function setInputText(t){
    if(!t)return;
    msgInput.value=t;updateCharCount();autoResizeTextarea();msgInput.focus();
  }

  // 首次点击时懒加载模型（~44MB，解压后存 IndexedDB，之后秒开）
  function loadVoskModel(){
    if(!voskModelPromise){
      voskModelPromise=new Promise(function(resolve,reject){
        if(!window.Vosk){reject(new Error('NO_VOSK'));return}
        Vosk.createModel('/assets/vosk/vosk-model-small-cn-0.22.zip').then(resolve,function(e){
          voskModelPromise=null;reject(e);
        });
      });
    }
    return voskModelPromise;
  }

  function cleanupRecognition(){
    hideStatus();
    if(silenceTimer){clearTimeout(silenceTimer);silenceTimer=null}
    if(procNode){try{procNode.disconnect()}catch(_){}procNode=null}
    if(audioCtx){try{audioCtx.close().catch(function(){})}catch(_){}audioCtx=null}
    if(mediaStream){mediaStream.getTracks().forEach(function(t){try{t.stop()}catch(_){}});mediaStream=null}
    if(recognizer){try{recognizer.remove()}catch(_){}recognizer=null}
    recognizing=false;lastPartial='';gotFinal=false;
    btnMic.classList.remove('listening');
  }

  function stopRecognition(){
    // 停止时若还没有最终结果，用已识别的部分结果填充
    if(lastPartial&&!gotFinal)setInputText(lastPartial);
    cleanupRecognition();
  }

  var MIC_BLOCKED_HELP='麦克风被浏览器阻止了。修复方法：点地址栏左侧的锁图标 → 网站设置 → 麦克风 改为「允许」→ 刷新页面 → 再点一次麦克风按钮。备选：地址栏输入 chrome://settings/content/microphone（Edge 为 edge://settings/content/microphone），把 localhost:3000 改为允许；若设置里没有麦克风选项，请检查 Windows 设置 → 隐私和安全性 → 麦克风 是否开启';

  // 统一入口：进入「正在听」状态并按可用方案启动识别（权限已同意后才调用）
  function startListening(){
    recognizing=true;gotFinal=false;lastPartial='';
    btnMic.classList.add('listening');
    if(window.Vosk)startVosk();else startSR();
  }

  function startVosk(){
    // 关键：麦克风权限弹窗只能在「用户点击后的短暂激活窗口」内触发（约 5 秒），
    // 必须点击后立刻申请——因此麦克风与模型加载并行启动：
    var grantedStream=null;
    var micPromise;
    try{
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
        cleanupRecognition();
        showStatus('当前访问地址无法使用麦克风：请用 http://localhost:3000 打开本页面');
        return;
      }
      // 用最宽松的音频参数申请（设备兼容性最好）；采样率由 AudioContext 统一转成 16k
      micPromise=navigator.mediaDevices.getUserMedia({audio:true})
        .then(function(s){grantedStream=s;return s});
    }catch(_){
      cleanupRecognition();
      voiceToast('麦克风启动失败，请重试');
      return;
    }
    if(!voskModelPromise)showStatus('正在准备语音包…（首次约 5 秒，之后很快）');
    var modelPromise=loadVoskModel().then(function(m){return m},function(e){
      e=e||new Error('model load fail');
      e.isModelLoad=true;e.noVosk=(e.message==='NO_VOSK');
      throw e;
    });
    Promise.all([modelPromise,micPromise]).then(function(res){
      var model=res[0],stream=res[1];
      if(!recognizing){stream.getTracks().forEach(function(t){t.stop()});return} // 加载期间用户取消了
      mediaStream=stream;
      var track=stream.getAudioTracks()[0];
      if(track){
        if(track.muted)voiceToast('麦克风当前是静音状态，取消静音后重试');
        track.onmute=function(){if(recognizing)voiceToast('麦克风被静音了')};
        track.onended=function(){if(recognizing){voiceToast('麦克风已断开');stopRecognition()}};
      }
      // 必须显式传 16k：不传时 worker 会以 undefined 采样率创建底层识别器（C++ 侧变为 NaN），
      // 只能靠首个音频块到达时重建才自愈，首次识别极易失败
      recognizer=new model.KaldiRecognizer(16000);
      recognizer.on('partialresult',function(m){
        if(m&&m.result&&m.result.partial){
          lastPartial=m.result.partial;
          msgInput.value=lastPartial;updateCharCount();autoResizeTextarea();
          // 有声音就重置静音计时
          if(silenceTimer){clearTimeout(silenceTimer)}
          silenceTimer=setTimeout(function(){voiceToast('没有听到声音，再试一次吧');stopRecognition()},6000);
        }
      });
      recognizer.on('result',function(m){
        if(m&&m.result&&m.result.text){
          gotFinal=true;
          var t=m.result.text.trim();
          setInputText(t);
          recognizer=null; // worker 在 FinalResult 中已释放该识别器
          stopRecognition();
        }
      });
      initAudioGraph(stream);
      showStatus('请对着麦克风说话…（停顿几秒会自动结束）',3000);
    }).catch(function(e){
      console.log('Vosk start fail:',e&&(e.message||e.name||e));
      if(grantedStream){grantedStream.getTracks().forEach(function(t){try{t.stop()}catch(_){}})}
      var wasRecognizing=recognizing;
      cleanupRecognition();
      if(!wasRecognizing)return; // 加载期间用户已取消，静默
      if(e&&(e.name==='NotAllowedError'||e.name==='PermissionDeniedError')){
        showMicPermModal('blocked'); // 浏览器层拒绝 → 弹窗给出修复指引
      }else if(e&&e.name==='SecurityError'){
        showStatus('当前访问地址无法使用麦克风：请用 http://localhost:3000 打开本页面');
      }else if(e&&e.isModelLoad&&e.noVosk){
        recognizing=true;btnMic.classList.add('listening');
        startSR(); // 识别库文件缺失，回退系统语音识别
      }else if(e&&e.isModelLoad){
        showStatus('语音包加载失败：模型文件缺失或损坏。请在项目目录运行 npm run fetch-vosk-model 下载后刷新页面重试');
      }else if(e&&e.name==='NotFoundError'){
        voiceToast('没有找到可用的麦克风设备，请检查电脑是否接入了麦克风');
      }else if(e&&e.name==='NotReadableError'){
        voiceToast('麦克风正被其他程序占用，请关闭后重试');
      }else{
        voiceToast('麦克风启动失败，请重试');
      }
    });
  }

  // 接通音频链路：麦克风流 → 16k 采样 → Vosk 识别器
  function initAudioGraph(stream){
    // 显式 16k 采样率：Vosk 只支持 8k/16k 输入；个别浏览器不支持指定采样率时
    // 退回默认采样率（worker 检测到采样率不匹配会自动重建识别器）
    try{
      audioCtx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
    }catch(_){
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    }
    if(audioCtx.state==='suspended')audioCtx.resume().catch(function(){});
    var source=audioCtx.createMediaStreamSource(stream);
    procNode=audioCtx.createScriptProcessor(4096,1,1);
    procNode.onaudioprocess=function(ev){
      if(!recognizer)return;
      try{recognizer.acceptWaveform(ev.inputBuffer)}catch(_){}
    };
    source.connect(procNode);procNode.connect(audioCtx.destination);
    silenceTimer=setTimeout(function(){voiceToast('没有听到声音，再试一次吧');stopRecognition()},6000);
  }

  function startSR(){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){
      recognizing=false;btnMic.classList.remove('listening');
      showStatus('当前浏览器不支持语音输入');
      return;
    }
    var rec=new SR();
    rec.lang='zh-CN';rec.interimResults=false;rec.continuous=false;
    rec.onresult=function(e){
      try{var t=e.results[0][0].transcript.trim();if(t)setInputText(t)}catch(_){}
    };
    rec.onerror=function(e){
      console.log('Speech error:',e.error);
      if(e.error==='not-allowed'||e.error==='service-not-allowed'){
        showMicPermModal('blocked');
      }else if(e.error==='network'){
        showStatus('系统语音识别需要连接国外服务，当前网络不可用。请改用离线语音包：在项目目录运行 npm run fetch-vosk-model 后刷新页面');
      }else if(e.error==='no-speech'){
        voiceToast('没有听到声音，再试一次吧');
      }
    };
    rec.onend=function(){btnMic.classList.remove('listening');recognizing=false;rec=null};
    try{rec.start()}catch(_){
      btnMic.classList.remove('listening');recognizing=false;
      voiceToast('语音启动失败，请重试');
    }
  }

  btnMic.addEventListener('click',function(){
    if(recognizing){stopRecognition();return}
    // 已同意过 → 直接语音输入，不再弹窗
    if(micConsented()){startListening();return}
    // 初次点击 → 弹窗询问是否允许；同时探测浏览器层权限，已被浏览器拒绝就直接切换为修复指引
    showMicPermModal('ask');
    queryBrowserMicPerm(function(state){
      if(state==='denied'&&!micConsented()&&!recognizing)showMicPermModal('blocked');
    });
  });
})();

// ===== Bubbles — 喇叭放气泡外面 =====
function getAvatarHTML(role){
  if(role==='user'){var s=(window.getStudentAvatar&&window.getStudentAvatar())||'assets/avatars/student/student-1.png';return'<div class="message-avatar student"><img src="'+s+'" alt="学生" onerror="this.src=\'assets/avatars/student/student-1.png\'"></div>'}
  else{var x=(window.getXiaoxinLogo&&window.getXiaoxinLogo())||'assets/characters/xiaoxin-chat-avatar.png';return'<div class="message-avatar"><img src="'+x+'" alt="小新" onerror="this.src=\'assets/characters/xiaoxin-chat-avatar.png\'"></div>'}
}
function addBubble(role,content){
  if(content==null)return;
  var row=document.createElement('div');row.className='message-row '+(role==='user'?'user':'assistant');
  if(role==='assistant')row.innerHTML=getAvatarHTML('assistant');
  var b=document.createElement('div');b.className='message-bubble';
  b.innerHTML='<span class="bubble-text">'+escapeHTML(content)+'</span>';
  var n=new Date(),ts=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  var t=document.createElement('time');t.textContent=ts;b.appendChild(t);

    var spk=document.createElement('button');spk.className='speak-btn';spk.title='朗读';
    spk.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14"/><path d="M15.54 8.46a5 5 0 010 7.07"/></svg>';
    spk.addEventListener('click',function(e){e.stopPropagation();if(spk.classList.contains('playing')){xfTtsController.stop();spk.classList.remove('playing');return}document.querySelectorAll('.speak-btn.playing').forEach(function(x){x.classList.remove('playing')});xfTtsController.speak(content,spk)});

function showTyping(){var r=document.createElement('div');r.className='message-row assistant';r.id='typingRow';r.innerHTML=getAvatarHTML('assistant');var d=document.createElement('div');d.className='message-bubble';d.id='typingBubble';d.innerHTML='<div class="typing-dots"><span></span><span></span><span></span></div>';r.appendChild(d);messageList.appendChild(r);r.scrollIntoView({block:'end',behavior:'instant'})}
function removeTyping(){var t=document.getElementById('typingRow');if(t)t.remove()}

// ===== Auto-save =====
// 新对话不再附加 convId，确保每次新建的对话都作为独立记录保存
function autoSave(){if(messages.length===0)return;var b={sessionId:sessionId,messages:messages,turnCount:turnCount,weather:weatherLabel};try{sessionStorage.setItem('xiaoxin_msg_backup',JSON.stringify({messages:messages,turnCount:turnCount,weather:weatherLabel}))}catch(_){}fetch('/api/history/auto-save',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).catch(function(){})}

// ===== Send message =====
async function sendMessage(){
  var text=msgInput.value.trim();if(!text||isLoading)return;
  var prevMessagesLen=messages.length,prevTurnCount=turnCount,prevConsecutiveShort=consecutiveShortCount,submittedText=text,submittedBubble=null;
  isLoading=true;msgInput.value='';autoResizeTextarea();updateCharCount();
  submittedBubble=addBubble('user',text);turnCount++;messages.push({role:'user',content:text});
  if(text.length<5)consecutiveShortCount++;else consecutiveShortCount=0;
  updateRoadmap();btnSend.disabled=true;showTyping();
  function rollbackUserMessage(){if(submittedBubble&&submittedBubble.isConnected)submittedBubble.remove();messages.length=prevMessagesLen;turnCount=prevTurnCount;consecutiveShortCount=prevConsecutiveShort;if(!msgInput.value)msgInput.value=submittedText;updateCharCount();autoResizeTextarea()}
  try{
    var resp=await fetch('/chat/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:sessionId,message:text})});
    var data=await resp.json();removeTyping();
    if (!resp.ok){rollbackUserMessage();var et='小新暂时无法回应，请稍后重试';switch (data.error){case'MESSAGE_EMPTY':et='消息不能为空';break;case'MESSAGE_TOO_LONG':et='消息过长，请精简到 2000 个字符以内';break;case'PAYLOAD_TOO_LARGE':et='发送内容过大，请精简后重试';break;case'INVALID_REQUEST':case'INVALID_JSON':et='消息格式不正确，请重新输入';break}addBubble('assistant',et);isLoading=false;btnSend.disabled=false;msgInput.focus();return}
    if(data.reply){addBubble('assistant',data.reply);messages.push({role:'assistant',content:data.reply});refreshQuickTopics()}else addBubble('assistant','(小新好像走神了，再试一次？)');
    if(data.imageUrl){var ir=document.createElement('div');ir.className='message-row assistant';ir.innerHTML=getAvatarHTML('assistant');var ib=document.createElement('div');ib.className='message-bubble';ib.style.textAlign='center';ib.innerHTML='<span class="bubble-text">🎨 今天聊的这几件事我都画下来啦～<br><span style="font-size:11px;color:#a09080;">画面正在生成中...</span></span>';ir.appendChild(ib);messageList.appendChild(ir);chatMessages.scrollTop=chatMessages.scrollHeight;var img=new Image();img.onload=function(){ib.innerHTML='<span class="bubble-text">今天聊的这几件事我都画下来啦，随时可以去手账本翻一翻哦～</span><br><img src="'+data.imageUrl+'" alt="配图" style="width:100%;max-width:360px;border-radius:12px;display:block;margin:8px auto 0;"><span style="font-size:11px;color:#a09080;">以后随时可以去手账本里再看到它哦</span>';chatMessages.scrollTop=chatMessages.scrollHeight};img.onerror=function(){ib.innerHTML='<span class="bubble-text">我把今天画下来啦～<br><span style="font-size:11px;color:#a09080;">(画面还在路上，稍后再来手账本看看吧)</span></span>'};img.src=data.imageUrl}
    autoSave();
  }catch(err){console.error('[sendMessage] 错误:',err);removeTyping();rollbackUserMessage();addBubble('assistant','(网络好像不太稳定，检查一下服务器吧)')}
  isLoading=false;btnSend.disabled=false;msgInput.focus();
}
btnSend.addEventListener('click',sendMessage);
msgInput.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage()}});

// ===== Textarea =====
function autoResizeTextarea(){msgInput.style.height='auto';msgInput.style.height=Math.min(msgInput.scrollHeight, 160)+'px'}
function updateCharCount(){charCount.textContent=msgInput.value.length+' / 2000'}
msgInput.addEventListener('input',function(){autoResizeTextarea();updateCharCount()});
msgInput.addEventListener('paste',function(e){var cur=msgInput.value,cl=(e.clipboardData||window.clipboardData||{}).getData?e.clipboardData.getData('text/plain'):'';if(!cl)return;var avail=2000-cur.length;if(cl.length>avail){e.preventDefault();var tr=cl.slice(0,avail),st=msgInput.selectionStart,en=msgInput.selectionEnd;msgInput.value=cur.slice(0,st)+tr+cur.slice(en);var np=st+tr.length;msgInput.setSelectionRange(np,np);autoResizeTextarea();updateCharCount();var toast=document.createElement('div');toast.textContent='最多输入 2000 个字符，超出部分未输入';toast.style.cssText='position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#51291f;color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:9999;opacity:1;transition:opacity .4s;pointer-events:none;';document.body.appendChild(toast);setTimeout(function(){toast.style.opacity='0'},1800);setTimeout(function(){if(toast.parentNode)toast.parentNode.removeChild(toast)},2300)}});

// ===== End chat =====
async function finalizeConversation(){if(turnCount===0||finalized)return;finalized=true;sessionStorage.setItem(XIAOXIN_SESSION_FINALIZED_KEY,'1');var b={sessionId:sessionId,messages:messages,turnCount:turnCount,weather:selectedWeather,weatherLabel:weatherLabel,completed:true};try{await fetch('/api/history',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})}catch(e){}try{var childMessages=messages.filter(function(item){return item.role==='user'}),longTurns=childMessages.filter(function(item){return item.content.length>=20}).length,totalChars=childMessages.reduce(function(sum,item){return sum+item.content.length},0),longest=childMessages.reduce(function(best,item){return item.content.length>best.length?item.content:best},''),topic=conversationTopic();await window.AIBole?.emitEvidence({module:'chat',event_type:'narrative_evidence',evidence_level:longTurns>=2?'strong':'reference',intelligence_candidates:['linguistic','intrapersonal'],behavior_summary:longTurns>=2?'能围绕话题持续展开，并用较完整的话表达自己的经历与想法。':'在聊天中表达了自己的兴趣与想法，可作为后续观察线索。',raw_evidence:{completed:true,duration_seconds:conversationDurationSeconds(),turn_count:turnCount,long_turn_count:longTurns,total_child_chars:totalChars,topic_source:'free_conversation',topic:topic,title:'聊聊'+topic,child_words:longest.slice(0,60)},context:{activity_id:sessionId,session_id:sessionId,idempotency_key:sessionId+':completed'}})}catch(e){}}
function buildEndUrl(){
  var params=new URLSearchParams();
  params.set('turns',turnCount);

  if(selectedWeather)params.set('weather',selectedWeather);
