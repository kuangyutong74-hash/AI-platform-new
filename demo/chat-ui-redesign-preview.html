<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>聊天观察 · 全新 UI 方向预览</title>
  <style>
    :root{--night:#182344;--ink:#332b3c;--paper:#fffaf0;--sun:#ffc754;--coral:#f37761;--blue:#80c8e9;--mint:#78cbae;--ease:cubic-bezier(.16,1,.3,1)}
    *{box-sizing:border-box}*::selection{background:var(--sun);color:var(--ink)}
    body{margin:0;min-width:320px;background:#111831;color:var(--ink);font-family:"LXGW WenKai","Microsoft YaHei",sans-serif;overflow-x:hidden}
    button{font:inherit}.concept-nav{position:fixed;z-index:30;left:50%;top:18px;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(18,25,52,.9);box-shadow:0 10px 24px rgba(5,8,25,.32);backdrop-filter:blur(14px)}
    .concept-nav button{min-height:42px;padding:0 18px;border:0;border-radius:999px;background:transparent;color:#dbe1f2;font-weight:700;cursor:pointer}.concept-nav button[aria-selected="true"]{background:var(--paper);color:var(--ink)}
    .concept-nav button:focus-visible,.primary:focus-visible,.icon-button:focus-visible,.topic:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
    .concept{display:none;min-heightvh:100vh;min-height:100svh}.concept.active{display:grid}
    .scene{position:relative;isolation:isolate;overflow:hidden;min-height:100vh;min-height:100svh;padding:92px clamp(22px,5vw,76px) 34px}
    .scene::before{content:"";position:absolute;inset:0;z-index:-3;background:url("../modules/chat/public/assets/background.jpg") center/cover}
    .scene::after{content:"";position:absolute;inset:0;z-index:-2;pointer-events:none;background:linear-gradient(90deg,rgba(23,30,65,.82),rgba(23,30,65,.35) 48%,rgba(23,30,65,.08)),linear-gradient(0deg,rgba(18,25,52,.48),transparent 50%)}
    .top{display:flex;align-items:center;justify-content:space-between;gap:20px;color:#fff;max-width:1440px;margin:auto}.brand{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800}.brand img{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 8px 8px rgba(0,0,0,.22))}.tools{display:flex;gap:8px}.icon-button{height:44px;padding:0 16px;border:0;border-radius:999px;background:rgba(255,250,240,.16);color:#fff;font-weight:700;cursor:pointer;backdrop-filter:blur(10px)}
    .stage{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(360px,.72fr);align-items:center;gap:clamp(34px,6vw,96px);max-width:1400px;min-height:calc(100vh - 180px);margin:auto}
    .copy{color:#fff;max-width:720px}.copy h1{max-width:650px;margin:0 0 22px;font-size:clamp(46px,6vw,92px);line-height:1.02;letter-spacing:-.03em;text-wrap:balance}.copy p{max-width:590px;margin:0 0 34px;color:#eef1f8;font-size:clamp(18px,1.6vw,24px);line-height:1.75}
    .primary{display:inline-flex;align-items:center;gap:12px;min-height:58px;padding:0 26px;border:0;border-radius:999px;background:var(--sun);color:#3a2c1f;box-shadow:0 6px 0 #d9932f,0 16px 34px rgba(8,12,35,.32);font-size:19px;font-weight:900;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}.primary:hover{transform:translateY(-3px);box-shadow:0 8px 0 #d9932f,0 22px 40px rgba(8,12,35,.34)}
    .character{position:relative;align-self:end;display:grid;place-items:end center;height:min(70vh,690px)}.character img{position:relative;z-index:2;max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 32px 28px rgba(9,12,34,.34));animation:arrive .85s var(--ease) both}.character::before{content:"";position:absolute;z-index:1;left:10%;right:10%;bottom:3%;height:13%;border-radius:50%;background:rgba(11,15,40,.28);filter:blur(16px)}
    @keyframes arrive{from{transform:translateY(26px) scale(.96);filter:blur(5px) drop-shadow(0 12px 12px rgba(9,12,34,.18))}to{transform:none;filter:blur(0) drop-shadow(0 32px 28px rgba(9,12,34,.34))}}
    .topics{position:absolute;left:clamp(22px,5vw,76px);right:clamp(22px,5vw,76px);bottom:30px;z-index:4;display:flex;gap:10px;max-width:1400px;margin:auto}.topic{min-height:48px;padding:0 18px;border:0;border-radius:14px;background:rgba(255,250,240,.92);color:var(--ink);box-shadow:0 10px 22px rgba(8,12,35,.2);font-weight:750;cursor:pointer}.topic:first-child{background:#ffeadf}
    .home-scene::before{filter-mode:luminosity}.home-scene::after{background:linear-gradient(90deg,rgba(26,31,65,.88),rgba(26,31,65,.2) 58%,transparent),linear-gradient(0deg,rgba(20,25,57,.6),transparent 45%)}
    .window-card{align-self:center;padding:36px;border-radius:16px;background:rgba(255,250,240,.96);box-shadow:0 18px 30px rgba(18,19,43,.18),0 44px 80px rgba(18,19,43,.2)}.window-card h2{margin:0 0 12px;font-size:32px}.window-card p{margin:0 0 24px;color:#615569;line-height:1.7}.mini-list{display:grid;gap:10px}.mini-list button{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:0 18px;border:0;border-radius:14px;background:#f4eee2;color:var(--ink);font-weight:750;cursor:pointer}
    .map-scene::before{filter:saturate(.65) brightness(.78)}.map-scene::after{background:linear-gradient(135deg,rgba(25,31,69,.92),rgba(42,55,99,.58)),radial-gradient(circle at 70% 40%,rgba(128,200,233,.28),transparent 30%)}
    .map-stage{grid-template-columns:minmax(340px,.76fr) minmax(0,1.24fr)}.conversation-map{position:relative;min-height:520px}.path{position:absolute;left:14%;right:4%;top:15%;bottom:12%;border:3px solid rgba(255,255,255,.34);border-left-color:transparent;border-radius:48% 52% 46% 54%;transform:rotate(-8deg)}.map-node{position:absolute;display:grid;place-items:center;width:150px;min-height:88px;padding:12px;border:0;border-radius:16px;background:#fffaf0;color:var(--ink);box-shadow:0 14px 28px rgba(8,12,35,.25);font-weight:800;text-align:center}.map-node:nth-of-type(2){left:4%;top:10%}.map-node:nth-of-type(3){right:16%;top:4%;background:#dff5ed}.map-node:nth-of-type(4){right:4%;bottom:18%;background:#ffe8dd}.map-node:nth-of-type(5){left:18%;bottom:5%;background:#deeff8}.map-character{position:absolute;left:38%;top:28%;width:210px;filter:drop-shadow(0 22px 20px rgba(6,9,28,.3))}
    .note{position:fixed;right:18px;bottom:18px;z-index:20;max-width:320px;padding:12px 16px;border-radius:14px;background:#fffaf0;color:#51465c;box-shadow:0 12px 28px rgba(5,8,25,.24);font-size:13px;line-height:1.55}
    @media(max-width:820px){.concept-nav{top:10px;width:calc(100% - 20px);overflow:auto;justify-content:flex-start}.concept-nav button{white-space:nowrap}.scene{padding:76px 20px 110px}.top{margin-top:12px}.tools .icon-button:first-child{display:none}.stage,.map-stage{grid-template-columns:1fr;align-content:start;gap:18px;padding-top:46px}.copy h1{font-size:clamp(40px,12vw,62px)}.copy p{font-size:17px;margin-bottom:24px}.character{position:absolute;right:-5%;bottom:88px;width:44%;height:43vh;opacity:.9}.topics{left:20px;right:20px;bottom:22px;overflow:auto}.topic{white-space:nowrap}.window-card{padding:24px}.conversation-map{min-height:410px}.map-character{width:150px}.map-node{width:112px;min-height:70px;font-size:13px}.note{display:none}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  </style>
</head>
<body>
  <nav class="concept-nav" aria-label="设计方向">
    <button aria-selected="true" data-show="living">星光客厅</button>
    <button aria-selected="false" data-show="window">秘密树屋</button>
    <button aria-selected="false" data-show="map">话题星路</button>
  </nav>

  <section class="concept active" id="living">
    <main class="scene">
      <header class="top"><div class="brand"><img src="../modules/chat/public/assets/characters/xiaoxin-logo.png" alt="">小新聊天屋</div><div class="tools"><button class="icon-button">我的手账</button><button class="icon-button">返回探索星球</button></div></header>
      <div class="stage"><div class="copy"><h1>今天发生了什么有意思的事？</h1><p>不用准备答案。说一件刚刚想到的小事，小新会认真听，也会陪你慢慢想。</p><button class="primary">开始和小新聊聊 <span aria-hidden="true">→</span></button></div><div class="character"><img src="../modules/chat/public/assets/characters/xiaoxin-chat-avatar.png" alt="小新"></div></div>
      <div class="topics" aria-label="聊天起点"><button class="topic">我今天很开心</button><button class="topic">有件事没想明白</button><button class="topic">我想讲个新发现</button></div>
    </main>
  </section>

  <section class="concept" id="window">
    <main class="scene home-scene">
      <header class="top"><div class="brand"><img src="../modules/chat/public/assets/characters/xiaoxin-logo.png" alt="">小新聊天屋</div><div class="tools"><button class="icon-button">我的记录</button><button class="icon-button">返回探索星球</button></div></header>
      <div class="stage"><div class="copy"><h1>这里是只属于你的安静角落。</h1><p>想说多少都可以，也可以先从一个轻松的小问题开始。</p><button class="primary">推开树屋的门 <span aria-hidden="true">→</span></button></div><aside class="window-card"><h2>想从哪里开始？</h2><p>任选一个，没有标准答案。</p><div class="mini-list"><button>讲讲今天 <span>→</span></button><button>说说心情 <span>→</span></button><button>分享一个脑洞 <span>→</span></button></div></aside></div>
    </main>
  </section>

  <section class="concept" id="map">
    <main class="scene map-scene">
      <header class="top"><div class="brand"><img src="../modules/chat/public/assets/characters/xiaoxin-logo.png" alt="">小新聊天屋</div><div class="tools"><button class="icon-button">聊天足迹</button><button class="icon-button">返回探索星球</button></div></header>
      <div class="stage map-stage"><div class="copy"><h1>沿着你的想法，走一条新的路。</h1><p>每次聊天都是一段小旅行。你来选第一站，后面的路可以边聊边决定。</p><button class="primary">选择第一站 <span aria-hidden="true">→</span></button></div><div class="conversation-map"><div class="path"></div><button class="map-node">今天的心情</button><button class="map-node">最近的新发现</button><button class="map-node">朋友和家人</button><button class="map-node">我的奇思妙想</button><img class="map-character" src="../modules/chat/public/assets/characters/xiaoxin-chat-avatar.png" alt="小新"></div></div>
    </main>
  </section>

  <p class="note">这是独立设计预览，不会修改正式聊天模块。建议先比较整体构图，再决定是否进入正式替换。</p>
  <script>
    const tabs=[...document.querySelectorAll('[data-show]')];
    tabs.forEach(tab=>tab.addEventListener('click',()=>{tabs.forEach(item=>item.setAttribute('aria-selected',String(item===tab)));document.querySelectorAll('.concept').forEach(item=>item.classList.toggle('active',item.id===tab.dataset.show))}));
  </script>
</body>
</html>
