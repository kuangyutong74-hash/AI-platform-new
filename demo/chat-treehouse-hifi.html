<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小新的星光树屋 · 高保真交互预览</title>
<style>
:root{--ink:#352b3d;--cream:#fff9eb;--gold:#ffc856;--coral:#f47b66;--mint:#82d0b3;--night:#20294f;--muted:#6e6074;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}*::selection{background:var(--gold);color:var(--ink)}body{margin:0;min-width:320px;color:var(--ink);font-family:"LXGW WenKai","Microsoft YaHei",sans-serif;background:#151c3c}button,textarea{font:inherit}button{cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.app{position:relative;isolation:isolate;min-height:100vh;overflow:hidden;background:url("chat-treehouse-bg-v1.png") center/cover}.app::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(18,24,52,.68),rgba(18,24,52,.12) 52%,rgba(18,24,52,.34)),linear-gradient(0deg,rgba(10,15,38,.46),transparent 46%)}
.topbar{position:relative;z-index:8;display:flex;align-items:center;justify-content:space-between;height:76px;padding:0 clamp(18px,3vw,48px);color:white}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px}.brand img{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 8px 8px rgba(5,8,24,.3))}.top-actions{display:flex;gap:8px}.soft-btn{min-height:44px;padding:0 16px;border:0;border-radius:999px;color:#fff;background:rgba(25,34,69,.64);box-shadow:0 8px 18px rgba(7,10,30,.18);backdrop-filter:blur(10px);font-weight:750}
.workspace{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:22px;height:calc(100vh - 76px);padding:0 clamp(18px,3vw,48px) 24px}.conversation{position:relative;min-width:0;display:flex;flex-direction:column}.welcome{max-width:610px;margin:auto auto 18px 3%;color:#fff;text-shadow:0 2px 12px rgba(6,10,30,.28)}.welcome h1{margin:0 0 10px;font-size:clamp(36px,4vw,66px);line-height:1.04;letter-spacing:-.03em;text-wrap:balance}.welcome p{margin:0;color:#f8f0e5;font-size:18px;line-height:1.65}
.chat-stream{display:none;flex:1;overflow:auto;padding:18px 3% 200px;scrollbar-width:thin;scrollbar-color:var(--gold) transparent}.chat-stream.show{display:block}.welcome.hide{display:none}.row{display:flex;gap:12px;align-items:flex-end;margin:0 0 18px}.row.me{justify-content:flex-end}.avatar{width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 8px 7px rgba(4,7,22,.24))}.bubble{max-width:min(620px,70%);padding:15px 19px;border-radius:16px 16px 16px 5px;background:var(--cream);box-shadow:0 9px 17px rgba(10,12,34,.17),0 22px 42px rgba(10,12,34,.13);font-size:16px;line-height:1.7}.me .bubble{border-radius:16px 16px 5px 16px;background:var(--gold)}
.desk-dock{position:absolute;left:2%;right:2%;bottom:18px;z-index:6}.props{display:flex;gap:10px;margin:0 0 12px}.prop{display:flex;align-items:center;gap:9px;min-height:48px;padding:0 16px;border:0;border-radius:14px;color:var(--ink);background:rgba(255,249,235,.94);box-shadow:0 8px 16px rgba(8,12,30,.18);font-weight:800;transition:transform .24s var(--ease)}.prop:hover{transform:translateY(-4px)}.prop svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8}.prop.story{background:#ffe2d8}.prop.puzzle{background:#e0f4ed}.prop.career{background:#dceef8}
.composer{display:grid;grid-template-columns:52px minmax(0,1fr) 54px;align-items:end;gap:8px;max-width:920px;padding:9px;border-radius:18px;background:rgba(255,249,235,.97);box-shadow:0 12px 22px rgba(8,12,30,.2),0 30px 58px rgba(8,12,30,.18)}.round{display:grid;place-items:center;width:52px;height:52px;border:0;border-radius:50%;background:#efe7d8;color:var(--ink)}.round.send{background:var(--gold);box-shadow:0 4px 0 #d7912f}.round svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}.composer textarea{width:100%;min-height:52px;max-height:120px;padding:14px 6px;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font-size:16px;line-height:1.5}.composer textarea::placeholder{color:#776a7d}
.star-map{align-self:stretch;margin-bottom:20px;padding:20px 16px;border-radius:16px;background:rgba(27,36,75,.79);box-shadow:0 16px 30px rgba(7,10,30,.2);backdrop-filter:blur(10px);color:#fff}.star-map h2{margin:0 0 20px;font-size:18px}.route{position:relative;display:grid;gap:18px}.route::before{content:"";position:absolute;left:18px;top:14px;bottom:14px;width:1px;background:rgba(255,255,255,.28)}.step{position:relative;display:grid;grid-template-columns:38px 1fr;align-items:center;gap:10px;border:0;background:transparent;color:#dcdff0;text-align:left}.step span{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#394579;box-shadow:0 5px 11px rgba(7,10,30,.25)}.step.current{color:#fff;font-weight:800}.step.current span{background:var(--gold);color:var(--ink)}
.shade{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:22px;background:rgba(12,14,29,.58);backdrop-filter:blur(9px)}.shade.open{display:grid}.weather-panel{position:relative;width:min(860px,96vw);min-height:580px;padding:42px 44px 36px;border-radius:28px;background:linear-gradient(160deg,#fdf8eb,#f4ead9);box-shadow:0 28px 70px rgba(5,8,25,.4);overflow:hidden}.close{position:absolute;right:20px;top:18px;width:44px;height:44px;border:0;border-radius:50%;background:#eee4d5;color:var(--ink);font-size:24px}.weather-panel header{text-align:center}.weather-panel h2{margin:0 0 9px;font-size:32px}.weather-panel p{margin:0;color:var(--muted)}
.weather-orbit{position:relative;height:350px;margin-top:22px}.weather-orbit::before{content:"";position:absolute;left:50%;top:46%;width:500px;height:225px;border:1px solid #d9c9b2;border-bottom:0;border-radius:260px 260px 0 0;transform:translate(-50%,-50%)}.weather{position:absolute;width:128px;height:106px;border:0;border-radius:16px;background:#fffaf0;box-shadow:0 10px 20px rgba(76,56,48,.12);color:var(--ink);font-weight:800;transition:transform .22s var(--ease),box-shadow .22s var(--ease)}.weather:hover,.weather.selected{transform:translateY(-5px) scale(1.04);box-shadow:0 15px 28px rgba(76,56,48,.18)}.weather.selected{background:#fff0c8}.weather svg{display:block;width:45px;height:45px;margin:0 auto 7px}.w1{left:5%;top:49%}.w2{left:20%;top:11%}.w3{left:42%;top:0}.w4{right:20%;top:11%}.w5{right:5%;top:49%}.w6{left:42%;bottom:0}.weather-confirm{display:block;min-width:180px;min-height:52px;margin:-8px auto 0;border:0;border-radius:999px;background:var(--gold);color:var(--ink);box-shadow:0 5px 0 #d7912f;font-weight:900}
.task-sheet{position:fixed;z-index:18;left:50%;bottom:22px;width:min(920px,calc(100% - 44px));padding:26px;transform:translate(-50%,120%);border-radius:22px;background:var(--cream);box-shadow:0 24px 62px rgba(5,8,25,.38);transition:transform .42s var(--ease)}.task-sheet.open{transform:translate(-50%,0)}.task-head{display:flex;justify-content:space-between;gap:20px;align-items:start}.task-head h2{margin:0 0 6px;font-size:25px}.task-head p{margin:0;color:var(--muted)}.progress{white-space:nowrap;font-weight:800;color:#7a667d}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.choice{min-height:128px;padding:16px;border:0;border-radius:16px;background:#f3ecdf;color:var(--ink);text-align:left}.choice:hover,.choice.selected{background:#ffe7ad;box-shadow:0 9px 18px rgba(0,0,0,.12)}.choice strong{display:block;margin-bottom:7px;font-size:18px}.choice small{color:var(--muted);line-height:1.5}.sheet-actions{display:flex;justify-content:flex-end;gap:10px}.secondary,.next{min-height:48px;padding:0 20px;border:0;border-radius:999px;font-weight:850}.secondary{background:#eee6d9;color:var(--ink)}.next{background:var(--gold);color:var(--ink)}
.preview-note{position:fixed;z-index:40;left:16px;bottom:14px;padding:8px 12px;border-radius:12px;background:#20294f;color:#fff;font-size:12px;box-shadow:0 8px 20px rgba(5,8,25,.24)}
@media(max-width:900px){.workspace{grid-template-columns:1fr}.star-map{display:none}.topbar{height:68px}.workspace{height:calc(100vh - 68px);padding-inline:14px}.welcome{position:absolute;left:2%;top:15%;max-width:78%;margin:0}.welcome h1{font-size:40px}.props{overflow:auto}.prop{white-space:nowrap}.bubble{max-width:82%}.weather-panel{min-height:0;padding:38px 18px 26px}.weather-orbit{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;height:auto;margin:24px 0}.weather-orbit::before{display:none}.weather{position:static;width:auto;height:82px}.task-sheet{max-height:88vh;overflow:auto;padding:20px}.choices{grid-template-columns:1fr}.choice{min-height:82px}.top-actions .soft-btn:first-child{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.001ms!important;animation-duration:.001ms!important}}
</style>
</head>
<body>
<main class="app">
  <header class="topbar"><div class="brand"><img src="../modules/chat/public/assets/characters/xiaoxin-logo.png" alt="小新">小新的星光树屋</div><nav class="top-actions"><button class="soft-btn">我的聊天记录</button><button class="soft-btn">返回探索星球</button></nav></header>
  <div class="workspace">
    <section class="conversation">
      <div class="welcome" id="welcome"><h1>坐下来吧，今天想聊点什么？</h1><p>可以说一件小事，也可以先选一个轻松的起点。</p></div>
      <div class="chat-stream" id="stream"><div class="row"><img class="avatar" src="../modules/chat/public/assets/characters/xiaoxin-chat-avatar.png" alt="小新"><div class="bubble">我在这里。今天有没有一件让你记得很清楚的事？</div></div><div class="row me"><div class="bubble">今天美术课画了一座会飞的房子。</div></div></div>
      <div class="desk-dock">
        <div class="props"><button class="prop" id="moodBtn"><svg viewBox="0 0 24 24"><path d="M5 15a7 7 0 1 1 13-4 5 5 0 0 1 0 10H7a4 4 0 0 1-2-6Z"/><path d="M8 4V2M3 8 1.5 7M13 3l1-1"/></svg>选今天的心情</button><button class="prop story" data-task="故事接龙"><svg viewBox="0 0 24 24"><path d="M4 5c3-2 5-2 8 0v16c-3-2-5-2-8 0V5Zm16 0c-3-2-5-2-8 0v16c3-2 5-2 8 0V5Z"/></svg>故事接龙</button><button class="prop puzzle" data-task="破解小难题"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4z"/><path d="m15 17 2 2 4-5"/></svg>破解小难题</button><button class="prop career" data-task="职业体验"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V4h8v3M3 12h18"/></svg>职业体验</button></div>
        <div class="composer"><button class="round" aria-label="语音输入"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><textarea id="input" rows="1" placeholder="告诉小新，你正在想什么……"></textarea><button class="round send" id="send" aria-label="发送"><svg viewBox="0 0 24 24"><path d="m3 11 18-8-7 18-3-7-8-3Z"/><path d="m11 14 4-5"/></svg></button></div>
      </div>
    </section>
    <aside class="star-map"><h2>这次聊天的星路</h2><div class="route"><button class="step current"><span>1</span>轻松开始</button><button class="step"><span>2</span>说说发生了什么</button><button class="step"><span>3</span>发现你的想法</button><button class="step"><span>4</span>收进成长手账</button></div></aside>
  </div>
</main>

<div class="shade" id="weatherShade"><section class="weather-panel" role="dialog" aria-modal="true" aria-labelledby="weatherTitle"><button class="close" id="weatherClose" aria-label="关闭">×</button><header><h2 id="weatherTitle">今天的心情像哪种天气？</h2><p id="weatherText">不用选得很准确，最接近就好。</p></header><div class="weather-orbit" id="weatherOrbit"></div><button class="weather-confirm" id="weatherConfirm">带着这个心情开始</button></section></div>

<section class="task-sheet" id="taskSheet" aria-live="polite"><div class="task-head"><div><h2 id="taskTitle">故事接龙</h2><p>选一个最像你想法的，不需要考虑标准答案。</p></div><span class="progress">第 1 张，共 3 张</span></div><div class="choices"><button class="choice"><strong>从一个神奇物品开始</strong><small>钥匙、种子、旧地图，什么都可以。</small></button><button class="choice"><strong>从一个特别的人开始</strong><small>可以是真实人物，也可以是想象中的伙伴。</small></button><button class="choice"><strong>从一个意外开始</strong><small>比如突然停电，或者窗外传来奇怪声音。</small></button></div><div class="sheet-actions"><button class="secondary" id="taskClose">这次先跳过</button><button class="next" id="taskNext">下一张</button></div></section>
<p class="preview-note">高保真交互预览 · 不连接真实聊天数据</p>
<script>
const weatherData=[['晴朗','sun'],['有点沉闷','cloud'],['很烦躁','storm'],['开心发光','rainbow'],['轻松自在','leaf'],['说不清','swirl']];
const icons={sun:'<circle cx="24" cy="24" r="10" fill="#ffc856"/><path d="M24 3v6M24 39v6M3 24h6M39 24h6M9 9l4 4M35 35l4 4M39 9l-4 4M13 35l-4 4"/>',cloud:'<path d="M12 31a9 9 0 0 1 4-17 12 12 0 0 1 23 5 7 7 0 0 1-2 14H14Z" fill="#c9d3e7"/>',storm:'<path d="M12 27a9 9 0 0 1 5-17 12 12 0 0 1 22 6 7 7 0 0 1-1 13H14Z" fill="#8d83d8"/><path d="m25 29-5 9h6l-3 8 10-12h-6l3-5" fill="#ffc856"/>',rainbow:'<path d="M8 34a16 16 0 0 1 32 0M13 34a11 11 0 0 1 22 0M19 34a5 5 0 0 1 10 0" stroke="#f47b66" stroke-width="5"/>',leaf:'<path d="M38 8C19 8 9 18 11 37c17 2 27-8 27-29Z" fill="#82d0b3"/><path d="M13 36 34 14"/>',swirl:'<path d="M14 25c0-13 22-13 22 0 0 12-20 12-20 2 0-8 14-8 14 0 0 5-8 5-8 1"/>'};
const orbit=document.getElementById('weatherOrbit');weatherData.forEach((item,i)=>{const b=document.createElement('button');b.className='weather w'+(i+1);b.innerHTML='<svg viewBox="0 0 48 48" stroke="#5d5572" fill="none" stroke-width="2" stroke-linecap="round">'+icons[item[1]]+'</svg>'+item[0];b.onclick=()=>{document.querySelectorAll('.weather').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('weatherText').textContent='今天像“'+item[0]+'”，小新会带着这份心情听你说。'};orbit.appendChild(b)});
const shade=document.getElementById('weatherShade');document.getElementById('moodBtn').onclick=()=>shade.classList.add('open');document.getElementById('weatherClose').onclick=()=>shade.classList.remove('open');document.getElementById('weatherConfirm').onclick=()=>shade.classList.remove('open');
const sheet=document.getElementById('taskSheet');document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{document.getElementById('taskTitle').textContent=b.dataset.task;sheet.classList.add('open')});document.getElementById('taskClose').onclick=()=>sheet.classList.remove('open');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});document.getElementById('taskNext').onclick=()=>sheet.classList.remove('open');
document.getElementById('send').onclick=()=>{const input=document.getElementById('input');if(!input.value.trim())return;document.getElementById('welcome').classList.add('hide');document.getElementById('stream').classList.add('show');input.value=''};
</script>
</body></html>
